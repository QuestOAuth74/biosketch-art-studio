[build]
  publish = "dist"

# Bump Node's old-space heap so Vite/Rollup can finish bundling without OOM
# (default ≈ 1.5 GB → 4 GB). The medical-models 3D viewer + three.js + drei
# additions pushed the production bundle past the default ceiling.
[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"

# Dynamic sitemap — serves blog posts, icons, and author pages from database
[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

# Edge function for bot prerendering (serves SEO HTML to crawlers)
[[edge_functions]]
  function = "prerender"
  path = "/"
